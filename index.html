<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<title>FoodStanDB</title>
	
	<style>
           .search-box {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #BFEFE3;
            border-radius: 24px;
            width: 350px;
            max-width: 100%;
            outline: none;
            vertical-align: middle;
            transition: all 0.2s ease;
        }

        /* Hiệu ứng viền xanh dương khi bấm chuột vào */
        .search-box:focus {
            border-color: #8ADDC6;
            box-shadow: 0 0 0 3px rgba(75, 162, 243, 0.2); 
        }

        /* Nút bấm chữ Search */
        .search-btn {
            background-color: #D2F4EA;
            border: 1px solid #dfe1e5;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 15px;
            color: #121A16; 
            font-weight: bold; /* Giữ chữ in đậm */
            cursor: pointer;
            margin-left: 6px;
            vertical-align: middle;
            transition: all 0.2s ease;
        }

        /* Hiệu ứng khi rê chuột vào nút bấm */
        .search-btn:hover {
            background-color: #BFEFE3;
        }
	</style>
</head>
<body style="background-color: #f8f9f9; color: #333333; font-family: sans-serif; padding: 20px;">
	<h1 style="text-align: center;">Tra Cứu Phụ Gia Thực Phẩm Việt Nam<br> Vietnam Food Additives Database</h1>
		<p style="text-align: center;">Dùng để tra cứu phụ gia được phép sử dụng trong thực phẩm ở Việt Nam.</p>
	<p style="text-align: center;">Use this tool to find the food additives permitted for use in food products sold in Vietnam.</p>
	<hr>
	<p style="margin-top: 1cm;">Nhập số INS hoặc tên phụ gia:</p>
		
    <!-- Ô nhập liệu có hiệu ứng viền xanh -->
    <input type="text" class="search-box">
    
    <!-- Nút bấm chữ Search in đậm màu xanh -->
    <button class="search-btn">Search</button>
</body>
</html>
