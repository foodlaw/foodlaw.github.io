<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FoodStanDB</title>
	
	<style>
        /* Khung bao quanh trang */
        body {
            background-color: #f8f9f9; 
            color: #333333; 
            font-family: sans-serif; 
            padding: 20px;
            margin: 0;
            position: relative;
        }

        /* Thanh chọn ngôn ngữ */
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            color: #666666;
            z-index: 10;
        }

        .lang-icon {
            margin-right: 6px;
            display: inline-flex;
            align-items: center;
            color: #15803d;
        }

        .language-switcher a {
            color: #666666;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .language-switcher a:hover {
            color: #15803d;
        }

        .language-switcher .active {
            font-weight: bold;
            color: #121A16;
            pointer-events: none;
        }

        .lang-divider {
            margin: 0 8px;
            color: #ccc;
        }

        /* Khung Header chuẩn tỉ lệ vàng */
        .header-container {
            display: flex;
            align-items: center;        
            justify-content: flex-start; 
            gap: 30px;                  
            margin-top: 40px;           
            margin-bottom: 25px;
        }

        /* Định dạng link cho Logo */
        .logo-box a {
            display: block;
            transition: transform 0.1s ease, opacity 0.1s ease;
        }
        
        /* Hiệu ứng rê chuột vào Logo */
        .logo-box a:hover {
            transform: scale(1.02); 
            opacity: 0.9;
        }

        /* HIỆU ỨNG KHI CLICK VÀO LOGO */
        .logo-box a:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .logo-box img {
            height: 93px; 
            width: auto;  
            display: block;
        }

        /* Định dạng link cho Tiêu đề */
        .title-link {
            text-decoration: none; 
            color: inherit;        
            display: block;
            transition: transform 0.1s ease, opacity 0.1s ease;
            transform-origin: left center; 
        }
        
        /* Hiệu ứng rê chuột vào Tiêu đề */
        .title-link:hover {
            opacity: 0.85;
        }

        /* HIỆU ỨNG KHI CLICK VÀO TIÊU ĐỀ */
        .title-link:active {
            transform: scale(0.99); 
            opacity: 0.7;           
        }

        .database-title {
            font-family: sans-serif;
            text-align: left; 
            margin: 0;
            display: flex;
            flex-direction: column;   
            justify-content: center;  
            gap: 5px;                 
        }

        .database-title .vi-text {
            color: #333333;        
            font-weight: 700;       
            font-size: 37px;          
            line-height: 1.1;         
        }

        .database-title .en-text {
            color: #8ADDC6;         
            font-weight: 600;       
            font-size: 32px;          
            line-height: 1.1;         
        }

        /* Khung bao quanh ô tìm kiếm và nút bấm */
        .search-container {
            text-align: left;
            margin-top: 15px;
        }

        /* Tạo flexbox để ô nhập và nút luôn cùng dòng hoặc co giãn đẹp mắt */
        .search-form-group {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 500px; /* Giới hạn chiều rộng tối đa */
        }

        .search-box {
            padding: 10px 15px;
            font-size: 16px;
            border: 1.5px solid #BFEFE3;   
            border-radius: 24px;
            flex: 1; /* Tự động co giãn chiếm không gian trống */
            min-width: 0; /* Ngăn ô input bị phình to vỡ khung */
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box:focus {
            border-color: #52C4A5;        
            box-shadow: 0 0 0 3px rgba(191, 239, 227, 0.6); 
        }

        .search-btn {
            background-color: #D2F4EA;
            border: none;                  
            border-radius: 24px;           
            padding: 11px 24px;           
            font-size: 15px;
            color: #121A16; 
            font-weight: bold; 
            cursor: pointer;
            white-space: nowrap; /* Ngăn chữ "Tra cứu" bị xuống hàng bên trong nút */
            transition: all 0.2s ease;
        }

        .search-btn:hover {
            background-color: #BFEFE3;    
        }

        /* ======================== TỰ ĐỘNG THU NHỎ TRÊN ĐIỆN THOẠI ======================== */
        @media (max-width: 768px) {
            body {
                padding: 15px; /* Giảm padding viền ngoài trên mobile */
            }

            /* Đổi vị trí chọn ngôn ngữ xuống dưới cùng hoặc đặt góc phải nhưng dịch lên */
            .language-switcher {
                top: 15px;
                right: 15px;
                font-size: 13px;
            }

            .header-container {
                flex-direction: column; 
                align-items: flex-start;
                gap: 15px;
                margin-top: 50px; /* Tạo khoảng cách tránh đè lên nút chọn ngôn ngữ */
            }

            .logo-box img {
                height: 70px; 
            }

            .database-title .vi-text {
                font-size: 24px; /* Thu nhỏ thêm một chút để vừa vặn màn hình dọc */
            }

            .database-title .en-text {
                font-size: 20px;
            }
        }
	</style>
</head>
<body>
    
    <!-- Thanh chọn ngôn ngữ góc phải -->
    <div class="language-switcher">
        <span class="lang-icon">
            <!-- Sửa lại xmlns chuẩn chuẩn của hệ thống W3C để hiển thị mượt mà trên mobile -->
            <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
        </span>
        <a href="?lang=vi" class="active">Tiếng Việt</a>
        <span class="lang-divider">|</span>
        <a href="?lang=en">English</a>
    </div>
    
    <!-- Phần Header -->
    <div class="header-container">
        <!-- Click vào Logo -->
        <div class="logo-box">
            <a href="/">
                <img src="logo.png" alt="FoodStanDB Logo">
            </a>
        </div>
        
        <!-- Click vào Tiêu đề -->
        <a href="/" class="title-link">
            <h1 class="database-title">
                <span class="vi-text">Tra Cứu Phụ Gia Thực Phẩm Việt Nam</span>
                <span class="en-text">Vietnam Food Additives Database</span>
            </h1>
        </a>
    </div>

	<hr style="border: 0; border-top: 1px solid #dfe1e5; margin: 20px 0;">
	
    <!-- Vùng tìm kiếm đã được tối ưu lại cấu trúc -->
    <div class="search-container">
        <p style="margin-top: 0; margin-bottom: 10px;">Nhập số INS hoặc tên phụ gia:</p> 
        <div class="search-form-group">
            <input type="text" class="search-box">
            <button class="search-btn">Tra cứu</button>
        </div>
    </div>
    
</body>
</html>
